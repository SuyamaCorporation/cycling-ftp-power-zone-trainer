<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サイクリング FTP パワーゾーン トレーナー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
<div class="max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold text-center text-orange-700 mb-1">サイクリング FTP パワーゾーン トレーナー</h1>
  <p class="text-center text-gray-500 text-sm mb-6">TrainingPeaks 式 7 ゾーン計算</p>

  <!-- Input -->
  <div class="bg-white rounded-xl shadow p-5 mb-6">
    <div class="flex flex-wrap gap-6 items-end">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">FTP (W)</label>
        <input type="number" id="ftp" value="250" min="50" max="600" class="border rounded px-3 py-2 text-sm w-28">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">体重 (kg)</label>
        <input type="number" id="weight" value="70" min="30" max="150" step="0.1" class="border rounded px-3 py-2 text-sm w-28">
      </div>
      <button id="calcBtn" class="bg-orange-600 text-white px-5 py-2 rounded font-medium hover:bg-orange-700" aria-label="ゾーン計算">ゾーン計算</button>
    </div>
    <div id="wpkgDisplay" class="mt-3 text-sm text-gray-600 hidden">
      <span class="font-semibold text-orange-700" id="wpkgValue"></span>
    </div>
  </div>

  <!-- Zone table -->
  <div class="bg-white rounded-xl shadow p-5 mb-6 overflow-x-auto">
    <h2 class="font-semibold text-gray-700 mb-3">パワーゾーン</h2>
    <table class="w-full text-sm" id="zoneTable">
      <thead>
        <tr class="text-left border-b">
          <th class="py-2 pr-3">ゾーン</th>
          <th class="py-2 pr-3">名称</th>
          <th class="py-2 pr-3">FTP比率</th>
          <th class="py-2 pr-3">出力 (W)</th>
          <th class="py-2">説明</th>
        </tr>
      </thead>
      <tbody id="zoneTbody"></tbody>
    </table>
  </div>

  <!-- Bar chart -->
  <div class="bg-white rounded-xl shadow p-5">
    <h2 class="font-semibold text-gray-700 mb-4">ゾーン棒グラフ</h2>
    <div id="barChart" class="space-y-2"></div>
  </div>
</div>

<script>
const ZONES = [
  { z:'Z1', name:'Active Recovery', pctLow:0,   pctHigh:55,  color:'bg-slate-300',  textColor:'text-slate-700', desc:'軽い回復走・疲労回復' },
  { z:'Z2', name:'Endurance',       pctLow:55,  pctHigh:75,  color:'bg-blue-300',   textColor:'text-blue-700',  desc:'有酸素持久力・ロングライド' },
  { z:'Z3', name:'Tempo',           pctLow:75,  pctHigh:87,  color:'bg-green-400',  textColor:'text-green-700', desc:'テンポ走・乳酸閾値向上' },
  { z:'Z4', name:'Threshold',       pctLow:87,  pctHigh:95,  color:'bg-yellow-400', textColor:'text-yellow-700',desc:'FTPインターバル・閾値向上' },
  { z:'Z5', name:'VO2 Max',         pctLow:95,  pctHigh:105, color:'bg-orange-400', textColor:'text-orange-700',desc:'VO2Max強化・短時間高強度' },
  { z:'Z6', name:'Anaerobic',       pctLow:105, pctHigh:120, color:'bg-red-400',    textColor:'text-red-700',   desc:'無酸素出力・スプリント基盤' },
  { z:'Z7', name:'Neuromuscular',   pctLow:120, pctHigh:null,color:'bg-purple-500', textColor:'text-purple-700',desc:'最大スプリント・神経筋パワー' },
];

function calc() {
  const ftp = parseFloat(document.getElementById('ftp').value);
  const weight = parseFloat(document.getElementById('weight').value);
  if (isNaN(ftp) || isNaN(weight) || ftp <= 0 || weight <= 0) return;

  const wpkg = (ftp / weight).toFixed(2);
  const wpkgDiv = document.getElementById('wpkgDisplay');
  wpkgDiv.classList.remove('hidden');
  document.getElementById('wpkgValue').textContent = `W/kg: ${wpkg}  （FTP = ${ftp}W, 体重 = ${weight}kg）`;

  const tbody = document.getElementById('zoneTbody');
  tbody.innerHTML = '';

  const barChart = document.getElementById('barChart');
  barChart.innerHTML = '';

  ZONES.forEach(z => {
    const low = Math.round(ftp * z.pctLow / 100);
    const high = z.pctHigh ? Math.round(ftp * z.pctHigh / 100) : null;
    const range = high ? `${low} – ${high} W` : `${low}+ W`;
    const pctRange = z.pctHigh ? `${z.pctLow}–${z.pctHigh}%` : `>${z.pctLow}%`;
    const barW = Math.min((z.pctHigh || 150) / 1.5, 100);
    const barLow = (z.pctLow / 1.5);

    const tr = document.createElement('tr');
    tr.className = 'border-b last:border-0';
    tr.innerHTML = `
      <td class="py-2 pr-3"><span class="font-bold ${z.textColor}">${z.z}</span></td>
      <td class="py-2 pr-3 font-medium">${z.name}</td>
      <td class="py-2 pr-3 text-gray-500">${pctRange}</td>
      <td class="py-2 pr-3 font-semibold">${range}</td>
      <td class="py-2 text-gray-500 text-xs">${z.desc}</td>
    `;
    tbody.appendChild(tr);

    // Bar
    const barDiv = document.createElement('div');
    barDiv.className = 'flex items-center gap-2 text-sm';
    barDiv.innerHTML = `
      <span class="w-8 font-bold ${z.textColor} text-right">${z.z}</span>
      <div class="flex-1 bg-gray-100 rounded h-7 relative overflow-hidden">
        <div class="${z.color} h-full rounded" style="width:${Math.min(barW,100)}%; margin-left:${Math.min(barLow,0)}%"></div>
        <span class="absolute inset-0 flex items-center px-2 text-xs font-semibold text-gray-800">${range}</span>
      </div>
      <span class="w-24 text-gray-500 text-xs">${pctRange} FTP</span>
    `;
    barChart.appendChild(barDiv);
  });
}

document.getElementById('calcBtn').addEventListener('click', calc);
calc();
</script>
</body>
</html>
